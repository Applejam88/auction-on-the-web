<header><div><div class="kicker">REUSE · BID · BINGO</div><h1 id="title">系辦惜物拍賣會</h1></div><div class="header-actions"><span id="saveStatus">正在讀取資料…</span><button id="projectButton">開啟投影</button><button id="quickBackup">JSON 備份</button></div></header>
<nav id="nav"></nav><main id="main"><div class="card">正在開啟本機資料庫…</div></main><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog>
<script>
'use strict';
// 單一離線 HTML。資料模型與 UI 放在同一檔案，無任何遠端依賴。
const VERSION=1, DB_NAME='department-reuse-auction-v1', KEY='event';
const $=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>'NT$ '+Number(x||0).toLocaleString('zh-TW');
const now=()=>new Date().toISOString(), uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const time=x=>x?new Date(x).toLocaleString('zh-TW',{hour12:false}):'—';
const statusNames={ready:'待拍賣',active:'拍賣中',sold:'已成交',passed:'流標'};
const initial=()=>({version:VERSION,revision:0,eventId:uid(),title:'系辦惜物拍賣會',products:[],specialPrize:null,bidders:[],rounds:[],sales:[],bingo:{locked:false,size:0,cells:[],lockedAt:null},awards:[],audit:[],ended:false,display:{mode:'auction',bidder:''},updatedAt:now()});
let state=initial(), db, busy=false, tab='home', selected='', projector=null, timer, restorePending=null, incoming=null, connectedAt=0,projectorSentRev=-1,preparing=false,projectionEventId='',bingoChoice='',bulkPreview=null;
const flippedCells=new Set(),celebratedSales=new Set();let celebrationTimer;
const projection=location.hash==='#projection';
const tabs=[['home','活動首頁'],['products','商品管理'],['auction','競標控制台'],['bidders','競標者名冊'],['bingo','拍賣賓果'],['settlement','結算管理'],['data','資料與說明']];
function toast(message,error=false){$('toast').textContent=message;$('toast').style.background=error?'#9f3d35':'#143f34';$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',5500)}
function need(test,msg){if(!test)throw Error(msg)}
function integer(v,min=0){const n=Number(v);need(String(v).trim()!==''&&Number.isSafeInteger(n)&&n>=min&&n<=1000000000,'金額須為 0–1,000,000,000 的整數元');return n}
function bidderId(v){need(/^\d{1,3}$/.test(String(v).trim()),'競標編號須為 001–999');const n=Number(v);need(n>=1&&n<=999,'競標編號須為 001–999');return String(n).padStart(3,'0')}
function activeSale(s,id){return s.sales.find(x=>x.productId===id&&!x.revoked)}
function activeRound(s,id){return [...s.rounds].reverse().find(x=>x.productId===id&&x.status==='active')}
function lastBid(r){return r?[...r.bids].reverse().find(x=>!x.revoked):null}
function invalidateAward(s,reason){s.awards.filter(x=>!x.void).forEach(x=>{x.void=true;x.voidReason=reason;x.voidAt=now()})}
function audit(s,type,detail){s.audit.push({id:uid(),time:now(),type,detail})}
function randomIndex(n){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}
function shuffled(xs){const a=[...xs];for(let i=a.length-1;i>0;i--){const j=randomIndex(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function lines(size){const a=[];for(let i=0;i<size;i++){a.push(Array.from({length:size},(_,j)=>i*size+j));a.push(Array.from({length:size},(_,j)=>j*size+i))}a.push(Array.from({length:size},(_,i)=>i*size+i));a.push(Array.from({length:size},(_,i)=>i*size+size-1-i));return a}
function rankings(s){const ls=lines(s.bingo.size), eligible=s.sales.filter(x=>!x.revoked);const rows=s.bidders.map(b=>{const won=eligible.filter(x=>x.bidderId===b.id);const ids=new Set(won.map(x=>x.productId));const marks=s.bingo.cells.map(id=>ids.has(id));const counts=ls.map(l=>l.filter(i=>marks[i]).length);const completed=ls.filter((l,i)=>counts[i]===s.bingo.size&&s.bingo.size>0);const best=Math.max(0,...counts);return {id:b.id,name:b.name,count:ids.size,amount:won.reduce((a,x)=>a+x.amount,0),marks,completed,best,bestLine:ls[counts.indexOf(best)]||[]}}).filter(x=>x.count>0);const hasLines=rows.some(x=>x.completed.length>0);const metric=x=>hasLines?x.completed.length:x.best;rows.sort((a,b)=>metric(b)-metric(a)||b.count-a.count||a.id.localeCompare(b.id));let rank=0;rows.forEach((r,i)=>{if(!i||metric(r)!==metric(rows[i-1])||r.count!==rows[i-1].count)rank=i+1;r.rank=rank});return {rows,hasLines,leaders:rows.filter(x=>x.rank===1)}}
function getSummary(s){const sales=s.sales.filter(x=>!x.revoked);return {sales,total:sales.reduce((a,x)=>a+x.amount,0),paid:sales.filter(x=>x.paid).reduce((a,x)=>a+x.amount,0),unpicked:sales.filter(x=>!x.picked).length}}
function openDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>q.result.createObjectStore('state');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error('資料庫被其他視窗阻擋，請關閉舊視窗後重新開啟'))})}
function readDB(){return new Promise((resolve,reject)=>{const t=db.transaction('state','readonly'),q=t.objectStore('state').get(KEY);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function writeDB(next,expected){return new Promise((resolve,reject)=>{const t=db.transaction('state','readwrite'),store=t.objectStore('state');let conflict=false;const q=store.get(KEY);q.onsuccess=()=>{if((q.result?.revision??0)!==expected){conflict=true;t.abort();return}store.put(next,KEY)};t.oncomplete=resolve;t.onabort=()=>reject(Error(conflict?'資料已由另一個控制台更新；已重新載入，請確認後再操作。':'儲存失敗：'+(t.error?.message||'資料庫寫入中止')));t.onerror=()=>{}})}
async function mutate(fn,label='已儲存'){if(busy||projection)return false;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('saveStatus').textContent='正在儲存…';try{const next=clone(state);fn(next);next.revision=state.revision+1;next.updatedAt=now();validate(next);await writeDB(next,state.revision);if(next.eventId!==state.eventId)bingoChoice=next.display.bidder;state=next;sendProjection();render();toast(label);return true}catch(e){toast(e.message,true);try{const saved=await readDB();if(saved)state=saved}catch{}render();return false}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);$('saveStatus').textContent='已儲存 '+time(state.updatedAt)}}
function validate(s){
 need(s&&s.version===VERSION,'備份格式或版本不支援');need(typeof s.eventId==='string'&&s.eventId.length>0&&typeof s.title==='string'&&s.title.trim().length>0&&s.title.length<=100,'活動設定不合法');need(Number.isSafeInteger(s.revision)&&s.revision>=0,'資料版本不合法');
 for(const k of ['products','bidders','rounds','sales','awards','audit'])need(Array.isArray(s[k]),'缺少資料：'+k);if(s.specialPrize!=null)validatePrize(s.specialPrize);need(typeof s.ended==='boolean'&&s.display&&['auction','bingo','ranking','award'].includes(s.display.mode)&&typeof s.display.bidder==='string','展示設定不合法');
 const unique=(arr,k)=>need(new Set(arr.map(x=>x[k])).size===arr.length,'資料識別碼重複');for(const k of ['products','bidders','rounds','sales','awards','audit'])unique(s[k],'id');
 const ids=new Set(s.products.map(x=>x.id)), bidders=new Set(s.bidders.map(x=>x.id)); const amount=n=>Number.isSafeInteger(n)&&n>=0&&n<=1000000000;const date=x=>typeof x==='string'&&Number.isFinite(Date.parse(x));const text=x=>typeof x==='string';
 s.products.forEach(p=>{need(/^\d{3,}$/.test(p.id)&&Number(p.id)>0&&text(p.name)&&p.name.trim()&&p.name.length<=100&&text(p.description)&&text(p.note)&&amount(p.start)&&statusNames[p.status],'商品資料不合法');need(p.photo===''||(/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(p.photo)&&p.photo.length<=15000000),'照片格式不合法（只接受 PNG、JPEG、WebP）')});
 s.bidders.forEach(b=>need(/^\d{3}$/.test(b.id)&&Number(b.id)>0&&text(b.name)&&b.name.trim()&&b.name.length<=100&&text(b.note),'競標者資料不合法'));
 need(s.rounds.filter(x=>x.status==='active').length<=1,'不能同時開拍多件商品');const bids=new Set(),roundNumbers=new Set();
 s.rounds.forEach(r=>{need(text(r.id)&&ids.has(r.productId)&&Number.isSafeInteger(r.number)&&r.number>0&&['active','sold','passed','revoked'].includes(r.status)&&Array.isArray(r.bids)&&date(r.startedAt),'拍賣輪次不合法');need(!roundNumbers.has(r.productId+':'+r.number),'商品輪次編號重複');roundNumbers.add(r.productId+':'+r.number);let highest=-1;const p=s.products.find(x=>x.id===r.productId);r.bids.forEach(b=>{need(text(b.id)&&!bids.has(b.id)&&bidders.has(b.bidderId)&&amount(b.amount)&&date(b.time)&&typeof b.revoked==='boolean','出價資料不合法');bids.add(b.id);if(!b.revoked){need(b.amount>=p.start&&b.amount>highest,'有效出價順序不合法');highest=b.amount}});if(r.status!=='active')need(date(r.endedAt),'缺少結標時間')});

function homeView(){const z=getSummary(state),resolved=state.products.filter(p=>['sold','passed'].includes(p.status)).length;return `<div class="hero"><span class="badge">離線現場拍賣 · v1.1 修訂版</span><h2 style="margin-top:14px">讓好物，找到下一位主人。</h2><p>商品、競標與賓果集中管理。先建立商品與名冊，檢查並鎖定賓果卡，即可開始現場拍賣。</p></div><div class="stats">${[['商品總數',state.products.length],['待拍／拍賣中',state.products.filter(p=>['ready','active'].includes(p.status)).length],['已成交',z.sales.length],['流標',state.products.filter(p=>p.status==='passed').length],['成交總額',money(z.total)]].map(([a,b])=>`<div class="stat"><span class="small muted">${a}</span><strong style="${String(b).length>10?'font-size:23px':''}">${b}</strong></div>`).join('')}</div><div class="card"><div class="row between"><h3>活動進度</h3><span>${resolved} / ${state.products.length} 件 · ${state.ended?'已結束':'進行中'}</span></div><div class="progress"><span style="width:${state.products.length?resolved/state.products.length*100:0}%"></span></div><p class="muted">賓果卡：${state.bingo.locked?'已鎖定 '+state.bingo.size+'×'+state.bingo.size:'尚未鎖定'}　｜　名冊：${state.bidders.length} 人</p></div><div class="card"><h3>建議操作流程</h3><div class="steps"><div><b>01 活動準備</b><p>先準備商品與名冊，再檢查並鎖定賓果卡。</p><div class="row">${action('goto-products','準備商品','','primary')}${action('goto-bidders','建立競標者名冊')}${action('goto-bingo','檢查賓果卡')}</div></div><div><b>02 現場拍賣</b><p>選商品開拍，輸入編號與金額，確認出價及成交。</p><div class="row">${action('goto-auction','進入競標控制台','','primary')}${action('open-projector','開啟投影')}</div></div><div><b>03 活動結算</b><p>所有商品結標後，結束拍賣、公布特別獎，再登記付款領取及備份。</p><div class="row">${action('end-event','結束拍賣','','gold')}${action('goto-bingo','結算特別獎')}${action('goto-settlement','付款與領取')}${action('goto-data','匯出與備份')}</div></div></div></div><div class="notice">請定期下載 JSON 完整備份。更換電腦、移動 HTML 檔案、使用不同瀏覽器或清除網站資料後，請透過備份還原。正式活動前請在實際電腦與投影機試跑。</div>`}

function auctionView(){const current=state.products.find(p=>p.status==='active');if(current)selected=current.id;if(!state.products.some(p=>p.id===selected))selected=state.products[0]?.id||'';const p=state.products.find(p=>p.id===selected),r=p?activeRound(state,p.id):null,b=lastBid(r);return `<h2>競標控制台</h2><p class="sub">快捷按鈕只填入金額。確認編號後按「記錄出價」，人工喊價完成後再確認成交。</p>${!state.bingo.locked?'<div class="notice">請先產生並鎖定賓果卡，再開始正式拍賣。</div>':''}<div class="card row"><label for="auctionProduct">拍賣商品</label><select id="auctionProduct" style="flex:1;min-width:220px">${state.products.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${x.id} · ${esc(x.name)}（${statusNames[x.status]}）</option>`).join('')}</select>${action('refresh','重新讀取資料')}</div>${p?`<div class="auction-layout"><div class="card">${photo(p)}<div class="row between" style="margin-top:18px"><h3>#${p.id} ${esc(p.name)}</h3>${badge(p)}</div><p style="white-space:pre-wrap">${esc(p.description)||'尚無描述'}</p><p class="muted">起標價 ${money(p.start)} · ${state.bingo.cells.includes(p.id)&&state.bingo.locked?'納入賓果':'不計入賓果'}</p>${!r&&['ready','passed'].includes(p.status)?action('start-auction',p.status==='passed'?'重新上架並開拍':'開始拍賣',p.id,'primary'):''}</div><div class="card"><span class="muted">${r?'目前最高有效出價':'目前狀態'}</span><div class="price">${b?money(b.amount):activeSale(state,p.id)?money(activeSale(state,p.id).amount):'尚無出價'}</div><p>競標者 <b style="font-size:26px">${b?'#'+b.bidderId:activeSale(state,p.id)?'#'+activeSale(state,p.id).bidderId:'—'}</b>${r?'　｜　第 '+r.number+' 輪':''}</p>${r?`<form id="bidForm"><div class="row"><div class="field"><label for="bidderInput">競標編號</label><input id="bidderInput" name="bidder" inputmode="numeric" maxlength="3" value="" placeholder="請輸入競標編號" autocomplete="off" list="bidderOptions" required><datalist id="bidderOptions">${state.bidders.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</datalist></div><div class="field"><label for="amountInput">出價金額（整數元）</label><input i function dataView(){return `<h2>資料管理與使用說明</h2><p class="sub">一個 HTML，完整離線運作。照片與紀錄保存在這個瀏覽器的本機資料庫。</p><div class="grid"><div class="card"><h3>活動設定</h3><form id="settingsForm"><div class="field"><label for="eventTitle">活動名稱</label><input id="eventTitle" name="title" value="${esc(state.title)}" maxlength="100" required></div><button class="primary">儲存名稱</button></form><h3 style="margin-top:28px">投影展示</h3><div class="field"><label for="displayMode">投影內容</label><select id="displayMode">${[['auction','商品與競標'],['bingo','賓果卡（共用／指定競標者）'],['ranking','排行榜'],['award','特別獎']].map(([a,b])=>`<option value="${a}" ${state.display.mode===a?'selected':''}>${b}</option>`).join('')}</select></div>${action('open-projector','開啟投影','','primary')} ${action('refresh','重新讀取資料')}<div class="field"><label for="projectionBingoBidder">賓果投影選擇</label><select id="projectionBingoBidder">${bingoOptions()}</select></div>${action('display-bingo','投影所選賓果卡','','primary')}<p class="small muted">先選擇共用卡或競標者，再按投影按鈕並確認提醒。只更改選擇不會立即切換投影。</p><p id="syncStatus" class="small muted">${projector&&!projector.closed?'投影視窗已開啟':'尚未開啟投影視窗'}</p></div><div class="card"><h3>完整備份與還原</h3><p>JSON 包含商品及特別獎照片、特別獎設定、歷次出價、成交、賓果配置、抽籤及更正紀錄。</p>${action('backup','下載 JSON 完整備份','','primary')}<div class="field" style="margin-top:24px"><label for="restoreFile">從 JSON 備份還原</label><input id="restoreFile" type="file" accept=".json,application/json"></div><div class="notice">還原前會驗證格式並顯示摘要，確認後整批替換。建議先下載目前資料備份。</div><h3>CSV 報表（Excel 相容）</h3><div class="row" style="margin-bottom:12px">${action('csv-all','一鍵下載全部 CSV（ZIP）','','primary')}</div><p class="small muted">下載一個 ZIP，解壓縮後取得以下全部 7 份 CSV 報表。</p><div class="row">${[['products','商品與成交'],['bids','全部出價'],['bidders','競標者名冊'],['sales','付款與領取'],['ranking','賓果排名'],['awards','特別獎紀錄'],['bingo','賓果卡排列']].map(([a,b])=>action('csv',b,a)).join('')}</div></div></div><div class="card"><h3>操作與備份提醒</h3><p class="small muted">交付檢查：核心規則、模擬介面與資料交易測試已通過。不同瀏覽器的本機檔案儲存、照片解碼及實際雙螢幕投影，請在活動電腦上驗收。</p><ol style="line-height:1.9"><li>在商品管理可新增特別獎名稱、說明與照片；特別獎不納入競標商品數或賓果格子。</li><li>先新增商品（可上傳 PNG、JPEG、WebP，單張最大 10 MB）與競標者，再產生賓果卡並鎖定。名冊可用「批次貼上姓名」一次新增，每行一位並先預覽編號。</li><li>控制台選商品「開始拍賣」，輸入競標者與金額。第一筆可等於起標價，後續至少高 1 元。</li><li>流標重新開拍會建立新輪次；撤銷出價與成交均保留歷史。成交金額或得標者更正後，付款與領取須重新確認。</li><li>所有商品已成交或流標後，在首頁操作流程或競標控制台結束拍賣，會自動前往拍賣賓果結算特別獎。更正成交會使既有特別獎結果失效，須重新結算。</li><li>開啟投影後將視窗移至第二螢幕，按「全螢幕」。賓果投影可選全場共用卡或指定競標者，按投影按鈕後會提醒確認。共用卡翻面可看商品名稱及得標者編號。請保留主持人視窗；投影以直接視窗訊息同步，可避開本機檔案來源限制。</li><li>投影若顯示失去同步，先回主持人視窗關閉再開啟投影。避免同時操作多個主持人控制台。</li><li>HTML 本身不攜帶活動資料。活動前、重要結算後及活動結束時，下載 JSON 備份至其他安全位置。</li><li>「一鍵下載全部 CSV」產生包含 7 份 CSV 的 ZIP，解壓縮後即可用 Excel 開啟；完整資料還原仍使用 JSON 備份。</li><li>本機儲存受瀏覽器、檔案位置與清除資料影響。用原瀏覽器與原路徑開啟；跨電腦需匯入 JSON。</li></ol><div class="row">${action('demo','載入示範資料（覆蓋目前活動）')}${action('reset','建立全新活動（清空目前資料）','','danger')}</div></div><div class="card"><h3>操作與更正歷史</h3><div class="history">${table(['時間','操作','內容'],state.audit.slice().reverse().map(a=>`<tr><td>${time(a.time)}</td><td>${esc(a.type)}</td><td>${esc(a.detail)}</td></tr>`))}</div></div>`}

// 批次貼上只處理姓名欄：保留一列一位，不以空格拆分名字。
function planBulkBidders(raw,s,skipDuplicates=true){need(typeof raw==='string'&&raw.length<=100000,'姓名清單過長，請分批貼上');const lines=raw.split(/\r\n|\r|\n/).map((name,i)=>({name:name.trim(),line:i+1})).filter(x=>x.name);need(lines.length>0,'請貼上競標者姓名，每行一位');const used=new Set(s.bidders.map(b=>b.id)),seen=new Set(s.bidders.map(b=>b.name.trim())),rows=[],skipped=[];let next=1;for(const x of lines){need(!x.name.includes('\t'),'第 '+x.line+' 行包含多欄資料，請只複製姓名欄');need(x.name.length<=100,'第 '+x.line+' 行姓名超過 100 字，請先修正');const duplicate=seen.has(x.name);if(duplicate&&skipDuplicates){skipped.push({...x,reason:'與現有名冊或清單前列姓名相同'});continue}while(next<=999&&used.has(String(next).padStart(3,'0')))next++;need(next<=999,'未使用的競標編號不足（001–999），請減少新增人數');const id=String(next++).padStart(3,'0');used.add(id);seen.add(x.name);rows.push({...x,id,warning:duplicate?'同名，將建立不同編號':''})}return {rows,skipped,eventId:s.eventId,revision:s.revision,raw,skipDuplicates}}

async function readPhoto(file){need(file.size<=10*1024*1024,'照片不得超過 10 MB');need(['image/png','image/jpeg','image/webp'].includes(file.type),'僅接受 PNG、JPEG、WebP');const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('照片讀取失敗'));r.readAsDataURL(file)});await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(Error('照片內容無法解碼'));img.src=url});return url}
function download(name,content,type){const blob=new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
function backup(){if(busy)return;download('惜物拍賣備份-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json',JSON.stringify(state,null,2),'application/json');toast('已產生完整備份，請確認瀏覽器下載完成')}
function csvCell(x){let s=String(x??'');if(/^[\s\uFEFF]*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csv(kind,returnOnly=false){let rows=[];const z=rankings(state);switch(kind){case 'products':rows=[['商品編號','名稱','描述','起標價','狀態','得標者','成交價','備註'],...state.products.map(p=>{const x=activeSale(state,p.id);return [p.id,p.name,p.description,p.start,statusNames[p.status],x?.bidderId||'',x?.amount??'',p.note]})];break;case 'bids':rows=[['商品編號','輪次','輪次狀態','競標者','出價','時間','撤銷'],...state.rounds.flatMap(r=>r.bids.map(b=>[r.productId,r.number,statusNames[r.status]||'成交撤銷',b.bidderId,b.amount,b.time,b.revoked?'是':'否']))];break;case 'bidders':rows=[['競標編號','姓名','備註'],...state.bidders.map(b=>[b.id,b.name,b.note])];break;case 'sales':rows=[['商品編號','商品名稱','競標者編號','姓名','成交價','成交時間','付款','領取','撤銷','備註'],...state.sales.map(x=>[x.productId,state.products.find(p=>p.id===x.productId)?.name,x.bidderId,state.bidders.find(b=>b.id===x.bidderId)?.name,x.amount,x.time,x.paid?'已付款':'未付款',x.picked?'已領取':'未領取',x.revoked?'是':'否',x.note])];break;case 'ranking':rows=[['名次','競標者','姓名','完整連線','最佳單線格數','得標件數','成交總額','排名模式','正式特別獎'],...z.rows.map(r=>[r.rank,r.id,r.name,r.completed.length,r.best,r.count,r.amount,z.hasLines?'完整連線':'最佳單線',state.awards.some(a=>!a.void&&a.winner===r.id)?'得獎':''])];break;case 'awards':rows=[['時間','候選人','得獎者','方式','失效','失效原因','特別獎名稱'],...state.awards.map(a=>[a.time,a.candidates.join('/'),a.winner,a.method,a.void?'是':'否',a.voidReason||'',a.prize?.name||state.specialPrize?.name||''])];break;case 'bingo':rows=[['列','欄','商品編號','鎖定','鎖定時間'],...state.bingo.cells.map((id,i)=>[Math.floor(i/state.bingo.size)+1,i%state.bingo.size+1,id,state.bingo.locked?'是':'否',state.bingo.lockedAt||''])];break}const content='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');if(returnOnly)return content;download('惜物拍賣-'+kind+'.csv',content,'text/csv;charset=utf-8')}

const CSV_REPORTS=[['products','商品與成交'],['bids','全部出價'],['bidders','競標者名冊'],['sales','付款與領取'],['ranking','賓果排名'],['awards','特別獎紀錄'],['bingo','賓果卡排列']];
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}
function zipStored(files){const enc=new TextEncoder(),parts=[],directory=[];let offset=0;const d=new Date(),year=Math.min(2107,Math.max(1980,d.getFullYear())),date=((year-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),stamp=(d.getHours()<<11)|(d.getMinutes()<<5)|Math.floor(d.getSeconds()/2);for(const f of files){const name=enc.encode(f.name),data=enc.encode(f.content),crc=crc32(data),local=new Uint8Array(30+name.length),v=new DataView(local.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(10,stamp,true);v.setUint16(12,date,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);local.set(name,30);parts.push(local,data);const central=new Uint8Array(46+name.length),c=new DataView(central.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,stamp,true);c.setUint16(14,date,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,offset,true);central.set(name,46);directory.push(central);offset+=local.length+data.length}const centralSize=directory.reduce((a,b)=>a+b.length,0),end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);const all=[...parts,...directory,end],result=new Uint8Array(offset+centralSize+22);let pos=0;for(const part of all){result.set(part,pos);pos+=part.length}return result}
function csvAll(){if(busy)return;const bytes=zipStored(CSV_REPORTS.map(([kind,label],i)=>({name:String(i+1).padStart(2,'0')+'-'+label+'.csv',content:csv(kind,true)})));download('惜物拍賣-全部CSV報表.zip',bytes,'application/zip');toast('全部 7 份 CSV 已打包，下載後解壓縮即可使用')}

function sendProjection(force=false){if(projector&&!projector.closed){if(force||projectorSentRev!==state.revision){projector.postMessage({type:'auction-state',state},'*');projectorSentRev=state.revision}else projector.postMessage({type:'auction-heartbeat',revision:state.revision},'*')}}
function openProjector(){if(projector&&!projector.closed){projector.focus();sendProjection(true);return}projectorSentRev=-1;projector=window.open(location.href.split('#')[0]+'#projection','auction-projection','width=1280,height=800');if(!projector){toast('請允許此檔案開啟彈出視窗',true);return}toast('投影視窗已開啟；請移至第二螢幕並按全螢幕')}
function renderProjection(){document.body.classList.add('projector');if(projectionEventId!==state.eventId){projectionEventId=state.eventId;flippedCells.clear();celebratedSales.clear();document.getElementById('celebration')?.remove()}$('title').textContent=state.title;$('nav').style.display='none';$('quickBackup').style.display='none';$('projectButton').textContent='全螢幕';$('projectButton').onclick=()=>document.documentElement.requestFullscreen().catch(()=>{});$('saveStatus').textContent=connectedAt&&Date.now()-connectedAt<4000?'投影已同步 · '+time(state.updatedAt):'等待主持人連線／同步已中斷';const mode=state.display.mode;let html='',saleId='';if(mode==='auction'){const p=state.products.find(p=>p.status==='active')||state.products.find(p=>p.id===state.display.productId);if(p){const b=lastBid(activeRound(state,p.id)),x=activeSale(state,p.id);html=`<div class="auction-layout"><div>${photo(p)}</div><div class="card"><span class="badge ${p.status}">#${p.id} · ${statusNames[p.status]}</span><h2 style="margin-top:20px">${esc(p.name)}</h2><p class="sub" style="font-size:24px;white-space:pre-wrap">${esc(p.description)}</p><span class="muted">${p.status==='sold'?'成交金額':b?'最高出價':'起標價'}</span><div class="price">${b?money(b.amount):x?money(x.amount):money(p.start)}</div><p style="font-size:32px">${b?'競標者 #'+b.bidderId:x?'恭喜得標者 #'+x.bidderId:p.status==='passed'?'本商品流標':'等待現場出價'}</p>${x?'<div class="sold-message">成交！好物找到新主人 🎉</div>':''}</div></div>`;if(x)saleId=x.id}else html='<div class="card"><h2>歡迎參加惜物拍賣會</h2><p class="sub">好物再利用，精彩即將開始。</p></div>'}else if(mode==='bingo'){const card=projectionBingo(state);html=`<div class="projection-bingo-heading"><h2>${esc(card.heading)}</h2><p class="sub">${esc(card.note)}</p></div>${card.id!==null?bingoGrid(state,card.id,true)+'<p class="flip-hint">點一下格子：翻面查看商品資訊 · 再點一下：回到商品編號</p>':'<div class="card empty">等待所選賓果卡</div>'}`}else if(mode==='ranking'){html=`<div class="card"><h2>賓果排行榜</h2>${rankTable(state,true)}</div>`}else{const a=state.awards.find(x=>!x.void);html=`<div class="card"><h2 style="text-align:center">賓果特別獎</h2>${specialPrizeCard(state,true)}<div class="winner">${a?'恭喜 #'+a.winner:'等待結算'}</div>${a?`<p style="text-align:center;font-size:28px">${a.method==='draw'?'最高同分者抽籤結果':'最高排名得獎者'}</p>`:''}</div>`}$('main').innerHTML=html+'<p class="projection-info">請保留主持人控制台開啟；同步中斷時，回控制台重新開啟投影。</p>';if(saleId)celebrateSale(saleId)}

window.addEventListener('message',e=>{if(projection){if(e.source!==window.opener)return;if(e.data?.type==='auction-heartbeat'){if(e.data.revision===state.revision){connectedAt=Date.now();$('saveStatus').textContent='投影已同步 · '+time(state.updatedAt)}return}if(e.data?.type!=='auction-state')return;try{validate(e.data.state);state=e.data.state;connectedAt=Date.now();renderProjection()}catch{}}else if(projector&&e.source===projector&&e.data?.type==='auction-request')sendProjection(e.data.revision!==state.revision)});
async function handleAction(a,id){switch(a){
case 'close-modal':closeModal();break;
case 'goto-auction':case 'goto-products':case 'goto-bingo':case 'goto-bidders':case 'goto-settlement':case 'goto-data':await navigate(a.slice(5));break;
case 'prize-edit':prizeDialog();break;case 'product-new':productDialog();break;case 'product-edit':productDialog(id);break;
case 'product-delete':if(confirm('確定刪除商品 #'+id+'？賓果草稿將清除。'))await mutate(s=>{need(!s.bingo.locked&&!s.rounds.some(r=>r.productId===id),'商品已有歷史或賓果已鎖定，不能刪除');s.products=s.products.filter(p=>p.id!==id);s.bingo={locked:false,size:0,cells:[],lockedAt:null};audit(s,'刪除商品',id)});break;
case 'bidder-bulk':bulkBidderDialog();break;case 'bulk-save':{need(bulkPreview&&bulkPreview.rows.length>0,'請先預覽姓名與編號');const plan=bulkPreview;const ok=await mutate(s=>{need(s.eventId===plan.eventId&&s.revision===plan.revision,'活動資料已有異動，請重新預覽編號');const checked=planBulkBidders(plan.raw,s,plan.skipDuplicates);need(JSON.stringify(checked.rows)===JSON.stringify(plan.rows),'名冊已有異動，請重新預覽編號');s.bidders.push(...checked.rows.map(x=>({id:x.id,name:x.name,note:''})));s.bidders.sort((a,b)=>a.id.localeCompare(b.id));audit(s,'批次新增競標者','新增 '+checked.rows.length+' 位；編號 '+checked.rows.map(x=>x.id).join('、')+'；略過重複姓名 '+checked.skipped.length+' 列')},'已批次新增 '+plan.rows.length+' 位競標者');if(ok){bulkPreview=null;closeModal()}break;}case 'bidder-new':bidderDialog();break;case 'bidder-edit':bidderDialog(id);break;
case 'bidder-delete':if(confirm('確定刪除競標者 #'+id+'？'))await mutate(s=>{need(!s.rounds.some(r=>r.bids.some(b=>b.bidderId===id))&&!s.sales.some(x=>x.bidderId===id),'已有紀錄，不能刪除');s.bidders=s.bidders.filter(b=>b.id!==id);if(s.display.bidder===id)s.display.bidder=''});break;
case 'bidder-wins':{const b=state.bidders.find(b=>b.id===id);showModal(`<h3>#${id} ${esc(b.name)} · 得標清單</h3>${table(['商品','成交價','付款','領取'],state.sales.filter(x=>!x.revoked&&x.bidderId===id).map(x=>`<tr><td>#${x.productId} ${esc(state.products.find(p=>p.id===x.productId).name)}</td><td>${money(x.amount)}</td><td>${x.paid?'已付款':'未付款'}</td><td>${x.picked?'已領取':'未領取'}</td></tr>`))}${action('close-modal','關閉')}`);break}
case 'select-auction':selected=id;await navigate('auction');break;
case 'increment':{const p=state.products.find(p=>p.id===selected),b=lastBid(activeRound(state,selected));$('amountInput').value=(b?b.amount:p.start)+Number(id);break}
case 'start-auction':await mutate(s=>{need(s.bingo.locked,'請先鎖定賓果卡');need(!s.products.some(p=>p.status==='active'),'請先結束目前拍賣中的商品');const p=s.products.find(p=>p.id===id);need(p&&['ready','passed'].includes(p.status),'此商品不能開拍');p.status='active';const number=s.rounds.filter(r=>r.productId===id).length+1;s.rounds.push({id:uid(),productId:id,number,status:'active',startedAt:now(),endedAt:null,bids:[]});s.ended=false;s.display.mode='auction';s.display.productId=id;invalidateAward(s,'重新開拍');audit(s,'開拍',id+' 第 '+number+' 輪')},'已開拍');break;
case 'undo-bid':{const b=lastBid(activeRound(state,id));need(b,'沒有可以撤銷的有效出價');if(confirm('撤銷 #'+b.bidderId+' 出價 '+money(b.amount)+'？'))await mutate(s=>{const x=lastBid(activeRound(s,id));need(x&&x.id===b.id,'出價已改變');x.revoked=true;x.revokedAt=now();audit(s,'撤銷出價',id+' / '+x.bidderId+' / '+x.amount)});break}
case 'sell':{const b=lastBid(activeRound(state,id)),p=state.products.find(p=>p.id===id);need(b,$('bidderInput')?.value.trim()?'沒有有效出價，請檢查是否有先紀錄出價，或使用流標':'沒有有效出價，請檢查是否有輸入競標編號，或使用流標');if(confirm('確認成交？\n商品 #'+id+' '+p.name+'\n得標者 #'+b.bidderId+'\n成交價 '+money(b.amount)))await mutate(s=>{const r=activeRound(s,id),x=lastBid(r);need(r&&x?.id===b.id&&!activeSale(s,id),'拍賣狀態已改變');r.status='sold';r.endedAt=now();s.products.find(p=>p.id===id).status='sold';s.sales.push({id:uid(),roundId:r.id,productId:id,bidderId:x.bidderId,amount:x.amount,time:now(),paid:false,picked:false,note:'',revoked:false});invalidateAward(s,'新增成交');audit(s,'成交',id+' / '+x.bidderId+' / '+x.amount)},'成交已確認，賓果已更新');break}
case 'pass':if(confirm('確認將商品 #'+id+' 標記流標？此輪出價將保留，重新開拍會建立新輪次。'))await mutate(s=>{const r=activeRound(s,id);need(r,'商品不在拍賣中');r.status='passed';r.endedAt=now();s.products.find(p=>p.id===id).status='passed';audit(s,'流標',id)});break;
case 'generate-bingo':await mutate(s=>{need(!s.bingo.locked,'賓果卡已鎖定');need(s.products.length>0,'請先新增商品');const size=Math.max(2,Math.ceil(Math.sqrt(s.products.length))),ids=shuffled(s.products.map(p=>p.id)),cells=[...ids];while(cells.length<size*size)cells.push(ids[(cells.length-ids.length)%ids.length]);s.bingo={locked:false,size,cells:shuffled(cells),lockedAt:null}},'賓果草稿已產生，請檢查並鎖定');break;
case 'lock-bingo':need(state.bingo.size>0,'請先產生賓果卡');if(confirm('確認鎖定此賓果排列？\n鎖定後不能改變排列；之後新增商品不計入賓果。'))await mutate(s=>{need(!s.bingo.locked&&s.bingo.size>0,'賓果卡不可鎖定');need(s.products.every(p=>s.bingo.cells.includes(p.id)),'商品已有變動，請重新產生賓果卡');s.bingo.locked=true;s.bingo.lockedAt=now();audit(s,'鎖定賓果',s.bingo.size+'×'+s.bingo.size)});break;
case 'end-event':{need(canEnd(state),'仍有待拍賣或拍賣中商品，請先完成全部商品');if(confirm('所有商品均已結標。確認結束拍賣並前往拍賣賓果結算特別獎？')){const ok=await mutate(s=>{need(canEnd(s),'商品狀態已變更，請先完成全部商品');s.ended=true;audit(s,'結束拍賣','全部商品已結標')});if(ok){tab='bingo';render()}}break;}
case 'finalize-award':{need(state.ended&&state.bingo.locked,'請先完成全部商品並在操作流程或競標控制台結束拍賣');need(!state.awards.some(a=>!a.void),'已有正式特別獎結果，不重複抽籤');const z=rankings(state);need(z.leaders.length>0,'全場無人得標，不產生特別獎');const candidates=z.leaders.map(x=>x.id);if(confirm('最高排名候選人：'+candidates.map(x=>'#'+x).join('、')+'\n'+(candidates.length>1?'確認從以上同分者隨機抽取一位？':'確認公布唯一最高排名者？')))await mutate(s=>{const top=rankings(s).leaders.map(x=>x.id);need(s.ended&&!s.awards.some(a=>!a.void)&&JSON.stringify(top)===JSON.stringify(candidates),'結算資料已改變');const winner=top[randomIndex(top.length)];s.awards.push({id:uid(),time:now(),candidates:top,winner,prize:s.specialPrize?clone(s.specialPrize):null,method:top.length>1?'draw':'single',void:false,mode:z.hasLines?'lines':'best',scores:rankings(s).rows.map(x=>({id:x.id,lines:x.completed.length,best:x.best,count:x.count}))});s.display.mode='award';audit(s,'特別獎',winner+' / 候選 '+top.join(','))},'特別獎結果已儲存');break}
case 'display-bingo':await projectSelectedBingo();break;case 'display-ranking':case 'display-award':await mutate(s=>{s.display.mode=a.slice(8)},'投影內容已更新');break;
case 'sale-edit':saleDialog(id);break;
case 'sale-revoke':{const x=state.sales.find(x=>x.id===id&&!x.revoked);need(x,'成交不存在');const reason=prompt('撤銷成交原因（必填）。'+(x.paid||x.picked?'此商品已付款或已領取，請先核對現場退款與歸還。':''));if(reason===null)break;need(reason.trim(),'請填寫撤銷原因');if(confirm('確定撤銷商品 #'+x.productId+' 的成交？商品將回到待拍賣，特別獎結果將失效。'))await mutate(s=>{const sale=s.sales.find(x=>x.id===id&&!x.revoked);need(sale,'成交已撤銷');sale.revoked=true;sale.revokedAt=now();sale.revokedReason=reason.trim();s.rounds.find(r=>r.id===sale.roundId).status='revoked';s.products.find(p=>p.id===sale.productId).status='ready';s.ended=false;invalidateAward(s,'撤銷成交');audit(s,'撤銷成交',JSON.stringify({sale,reason}))});break}
case 'backup':backup();break;case 'csv':csv(id);break;case 'csv-all':csvAll();break;case 'print':window.print();break;case 'open-projector':openProjector();break;
case 'refresh':{const saved=await readDB();if(saved){validate(saved);state=saved}sendProjection();render();toast('已重新讀取儲存資料');break}

}}
document.addEventListener('click',async e=>{if(projection){const cell=e.target.closest('[data-flip]');if(cell){const key=cell.dataset.flip;if(flippedCells.has(key))flippedCells.delete(key);else flippedCells.add(key);const on=flippedCells.has(key);cell.classList.toggle('flipped',on);cell.setAttribute('aria-pressed',String(on))}return;}const b=e.target.closest('button');if(!b||busy||preparing)return;try{if(b.dataset.tab){await navigate(b.dataset.tab)}else if(b.dataset.action)await handleAction(b.dataset.action,b.dataset.id)}catch(err){toast(err.message,true)}});
document.addEventListener('submit',async e=>{if(projection)return;e.preventDefault();if(busy||preparing)return;preparing=true;const f=e.target, data=new FormData(f);try{switch(f.getAttribute('id')){
case 'productForm':{const name=String(data.get('name')).trim(),start=integer(data.get('start')),id=f.dataset.id;need(name,'請填寫商品名稱');const file=data.get('photo');let url=null;if(file?.size)url=await readPhoto(file);const ok=await mutate(s=>{let p=s.products.find(p=>p.id===id);if(!p){const num=Math.max(0,...s.products.map(p=>Number(p.id)))+1;p={id:String(num).padStart(3,'0'),status:'ready',photo:''};s.products.push(p);s.ended=false;invalidateAward(s,'新增商品')}if(s.rounds.some(r=>r.productId===p.id))need(start===p.start,'已有歷史，不能更改起標價');Object.assign(p,{name,start,description:String(data.get('description')),note:String(data.get('note'))});if(url)p.photo=url;else if(data.get('removePhoto'))p.photo='';audit(s,'商品資料',p.id+' / '+name)});if(ok)closeModal();break}
case 'prizeForm':{const name=String(data.get('name')).trim(),description=String(data.get('description'));need(name,'請填寫特別獎名稱');const file=data.get('photo');let url=null;if(file?.size)url=await readPhoto(file);const ok=await mutate(s=>{const previous=s.specialPrize;s.specialPrize={name,description,photo:url??(data.get('removePhoto')?'':previous?.photo||'')};audit(s,'設定特別獎',JSON.stringify({previousName:previous?.name||'',name,description,hasPhoto:!!s.specialPrize.photo}))},'特別獎已儲存');if(ok)closeModal();break}
case 'bulkBidderForm':{const plan=planBulkBidders(String(data.get('names')),state,data.has('skipDuplicates'));bulkPreview=plan;renderBulkPreview(plan);break;}
case 'bidderForm':{const id=bidderId(data.get('bidderId')),name=String(data.get('name')).trim();need(name,'請填寫姓名或暱稱');const ok=await mutate(s=>{const b=s.bidders.find(x=>x.id===id);if(f.dataset.id){need(b,'名冊已改變');Object.assign(b,{name,note:String(data.get('note'))})}else{need(!b,'此編號已存在');s.bidders.push({id,name,note:String(data.get('note'))});s.bidders.sort((a,b)=>a.id.localeCompare(b.id))}audit(s,'競標者資料',id)});if(ok)closeModal();break}
case 'bidForm':{const id=bidderId(data.get('bidder')),amount=integer(data.get('amount'));await mutate(s=>{const p=s.products.find(p=>p.id===selected),r=activeRound(s,selected),b=lastBid(r);need(r&&p.status==='active','商品不在拍賣中');need(s.bidders.some(x=>x.id===id),'競標者不存在，請先現場新增名冊');need(b?amount>b.amount:amount>=p.start,b?'出價須高於目前最高有效價':'第一筆出價不得低於起標價');r.bids.push({id:uid(),bidderId:id,amount,time:now(),revoked:false})},'出價已記錄');$('bidderInput')?.focus();break}
case 'settingsForm':{const title=String(data.get('title')).trim();need(title,'活動名稱不可空白');await mutate(s=>{s.title=title});break}
case 'saleForm':{const id=f.dataset.id,amount=integer(data.get('amount')),bidder=String(data.get('bidder')),reason=String(data.get('reason')).trim();const orig=state.sales.find(x=>x.id===id&&!x.revoked);need(orig,'成交不存在');const changed=orig.amount!==amount||orig.bidderId!==bidder;need(!changed||reason,'請填寫更正原因');if(changed&&!confirm('確認更正得標者或成交價，並重設付款、領取狀態？'))break;const ok=await mutate(s=>{const sale=s.sales.find(x=>x.id===id&&!x.revoked);need(sale,'成交已改變');const old=clone(sale);if(changed){sale.paid=false;sale.picked=false;invalidateAward(s,'更正成交')}sale.bidderId=bidder;sale.amount=amount;sale.note=String(data.get('note'));audit(s,'更正成交',JSON.stringify({before:old,after:sale,reason}))});if(ok)closeModal();break}
}}catch(err){toast(err.message,true)}finally{preparing=false}});
document.addEventListener('input',e=>{if(e.target.id==='bulkNames')clearBulkPreview();if(e.target.id==='bidderSearch')$('bidderTable').innerHTML=bidderTable(e.target.value);if(e.target.id==='saleSearch')filterSales()});
function filterSales(){$('saleTable').innerHTML=saleTable($('saleSearch').value,$('paymentFilter').value,$('pickupFilter').value)}
document.addEventListener('change',async e=>{if(projection)return;const el=e.target;try{if(busy)return;if(el.id==='bulkSkip')clearBulkPreview();else if(el.id==='auctionProduct'){selected=el.value;render();await mutate(s=>{s.display.productId=selected},'投影商品已選擇')}else if(el.id==='bingoBidder'||el.id==='projectionBingoBidder'){bingoChoice=el.value;render()}else if(el.id==='displayMode'){const mode=el.value;if(mode==='bingo'){await projectSelectedBingo();render()}else await mutate(s=>s.display.mode=mode,'投影模式已更新')}else if(el.dataset.payment||el.dataset.pickup){const id=el.dataset.payment||el.dataset.pickup,checked=el.checked;await mutate(s=>{const x=s.sales.find(x=>x.id===id&&!x.revoked);need(x,'成交已改變');if(el.dataset.payment)x.paid=checked;else x.picked=checked;audit(s,el.dataset.payment?'付款登記':'領取登記',x.productId+' / '+checked)})}else if(['paymentFilter','pickupFilter'].includes(el.id))filterSales();else if(el.name==='photo'&&el.files[0]){const url=await readPhoto(el.files[0]);$('photoPreview').innerHTML=`<img class="photo-preview" src="${esc(url)}" alt="新照片預覽">`}else if(el.id==='restoreFile'){need(el.files[0].size<=200*1024*1024,'備份超過 200 MB，請縮減照片後再備份');const s=JSON.parse(await el.files[0].text());validate(s);restorePending=s;showModal(`<h3>備份驗證通過</h3><p><b>${esc(s.title)}</b></p><p>儲存時間：${time(s.updatedAt)}</p><p>特別獎：${esc(s.specialPrize?.name||'尚未設定')}</p><p>商品 ${s.products.length} 件 · 競標者 ${s.bidders.length} 人 · 有效成交 ${s.sales.filter(x=>!x.revoked).length} 件 · 照片 ${s.products.filter(p=>p.photo).length+(s.specialPrize?.photo?1:0)} 張</p><div class="notice">確認後將覆蓋目前全部活動資料，不能自動合併。請先備份目前活動。</div><div class="row">${action('restore-confirm','確認完整還原','','danger')}${action('close-modal','取消')}</div>`);el.value=''}}catch(err){toast('操作失敗：'+err.message,true);if(el.type==='checkbox')el.checked=!el.checked;if(el.id==='restoreFile')el.value=''}});
$('projectButton').onclick=openProjector;$('quickBackup').onclick=backup;
async function boot(){if(projection){$('projectButton').onclick=()=>document.documentElement.requestFullscreen().catch(()=>{});renderProjection();if(window.opener)window.opener.postMessage({type:'auction-request',revision:connectedAt?state.revision:null},'*');setInterval(()=>{if(window.opener)window.opener.postMessage({type:'auction-request',revision:connectedAt?state.revision:null},'*');if(Date.now()-connectedAt>4000)renderProjection()},1000);return}try{db=await openDB();db.onversionchange=()=>{db.close();toast('資料庫版本變更，請重新開啟',true)};const saved=await readDB();if(saved){validate(saved);state=saved}bingoChoice=state.display.bidder;render();setInterval(sendProjection,1000)}catch(e){$('saveStatus').textContent='資料庫無法使用';$('main').innerHTML=`<div class="notice"><h2>本機資料庫無法開啟</h2><p>${esc(e.message)}</p><p>請使用一般模式的 Chrome／Edge 開啟下載的原始 HTML，避免無痕模式。系統未啟用競標，以免資料無法保存。</p></div>`;$('projectButton').disabled=true;$('quickBackup').disabled=true}}
// 提供開發者可讀的核心函式，方便修改後執行規則測試。
window.AuctionCore={initial,validate,lines,rankings,csvCell,getSummary};boot();
